        <!--hero-->
        <section class="hero">
            <div class=""hero-content>
                <h1>Protea Phoenix</h1>

                <p>From the Ashes of the sun</p>
                <a href="#profiles-container" class="hero-btn">START A CALL</a>

        <!--About-->
        <section class="about">
            <div class="about-text">
                <h1>About Us</h1>

        </section>

        <!--Profiles-->
        <section id="profiles-container">
            <h2>Our Phychics</h2>
            <div class="profile-grid">
                <div class="profile-card">
                    <p class="status">
    <span class="dot"></span>
    <span class="status-text">Offline</span>
</p>
                    <img src="Asset/portfolio/IMG_2479.JPG" alt="">
                    <h3>name</h3>
                    <p>details</p>
                    <button onclick="gotoPricing(1)">View Pricing</button>
                </div>
            </div>
        </section>

    <script>
    const statusElements = document.querySelectorAll(".status");

    statusElements.forEach(status => {
        const text = status.querySelector(".status-text");

        // random for demo (or force one online)
        const isOnline = Math.random() > 0.5;

        if (isOnline) {
            status.classList.add("online");
            status.classList.remove("offline");
            text.innerText = "Online";
        } else {
            status.classList.add("offline");
            status.classList.remove("online");
            text.innerText = "Offline";
        }
    });
</script>
        <script src="script.js"></script>
    </body>
